# Reins production configuration — non-secret, environment-specific values.
# Secrets (API keys, tokens, passwords, DB URL) go in Fly secrets.
# Environment variables (including Fly secrets) always override values here.

server:
  port: 5001
  host: 0.0.0.0
  log_level: info

urls:
  dashboard_url: https://app.helm.mom
  public_url: https://app.helm.mom

oauth:
  google_redirect_uri: https://app.helm.mom/api/oauth/google/callback
  google_login_redirect_uri: https://app.helm.mom/api/auth/google/callback
  microsoft_redirect_uri: https://app.helm.mom/api/oauth/microsoft/callback
  microsoft_tenant_id: common

browser:
  max_instances: 5
  idle_timeout_ms: 300000
